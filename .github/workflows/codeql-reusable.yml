name: CodeQL SAST reusable
on:
  workflow_call:
    inputs:
      profile:
        description: java or angular
        required: true
        type: string
      module_path:
        description: Relative Maven module path for Java
        required: false
        default: getting-started
        type: string
      java_version:
        description: JDK for Quarkus build
        required: false
        default: '17'
        type: string
      query_suite:
        description: default or security-extended
        required: false
        default: default
        type: string
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  scan:
    name: CodeQL ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate inputs
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          MODULE_PATH: ${{ inputs.module_path }}
          QUERY_SUITE: ${{ inputs.query_suite }}
        run: |
          case "$PROFILE" in java|angular) ;; *) echo 'Invalid profile'; exit 1;; esac
          case "$QUERY_SUITE" in default|security-extended) ;; *) echo 'Invalid query suite'; exit 1;; esac
          if [[ ! "$MODULE_PATH" =~ ^[a-zA-Z0-9_./-]+$ || "$MODULE_PATH" == /* || "$MODULE_PATH" == *..* ]]; then
            echo 'Invalid module path'; exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: inputs.profile == 'java'
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ inputs.profile == 'java' && 'java-kotlin' || 'javascript-typescript' }}
          build-mode: ${{ inputs.profile == 'java' && 'manual' || 'none' }}
          queries: ${{ inputs.query_suite == 'security-extended' && 'security-extended' || '' }}
      - name: Build Quarkus module
        if: inputs.profile == 'java'
        shell: bash
        env:
          MODULE_PATH: ${{ inputs.module_path }}
        run: mvn -B -ntp -f "$MODULE_PATH/pom.xml" -DskipTests package
      - name: Verify Angular build
        if: inputs.profile == 'angular'
        run: |
          npm ci
          npm run build
      - name: Analyze and upload CodeQL results
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: plard-poc/${{ inputs.profile }}
          output: codeql-sarif
      - name: Summarize SARIF
        uses: DavidFaustino/ssdlc-codeql-poc/actions/codeql-summary@f82a413f55866636069d07c9371be99d54f4b09e
        with:
          sarif-directory: ${{ steps.analyze.outputs.sarif-output }}
          output-directory: codeql-summary
      - name: Save sanitized summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeql-summary-${{ inputs.profile }}
          path: codeql-summary/
          retention-days: 14
